name: Packaging

on:
  push:
    tags:
      # normal releases semvar
      - "v[0-9]+.[0-9]+.[0-9]+"
      # dev builds like dev-YYYY.MM.DD-0, where 0 is the build number for that day
      - "dev-[0-9][0-9][0-9][0-9].[0-9][0-9].[0-9][0-9]-[0-9]+"

jobs:
  linux-build:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3

      - name: Run packaging script
        run: uv run --locked python package.py

      - name: Zip Executable
        shell: bash
        run: zip -yr bsw-x86_64.zip dist/*

      - name: Create Dev Build Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/dev-')
        with:
          prerelease: true
          generate_release_notes: false
          body: "This is a dev build. It very likely contains bugs and is not recommended for use."
          files: bsw-x86_64.zip

      - name: Create Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          generate_release_notes: true
          files: bsw-x86_64.zip
